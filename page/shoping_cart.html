<!-- PRODUCTS -->
<main class="container shop-container" id="products">

    <div class="shop-heading">
        <p class="text-danger mb-2">━━ OUR COLLECTION</p>
        <h1 class="text-white fw-bold">Shop All Products</h1>
        <p class="text-secondary">Discover our premium fitness equipment.</p>
    </div>

    <div class="row g-4" id="productGrid"></div>

</main>

<!-- GENERATE 20 CARDS -->
<script>
const products = [
    { name: "Adjustable Bench", price: 299, image: "../asset/sandali1.png", rating: "4.8", badge: "Sale" },
    { name: "Hex Dumbbell Set", price: 199, image: "../asset/download.png", rating: "4.9", badge: "Hot" },
    { name: "Treadmill Pro 500", price: 1299, image: "../asset/file_00000000a35081f4a258f315ae048e94.png", rating: "4.7" },
    { name: "Home Gym Station", price: 899, image: "../asset/file_0000000089d48243ace9d6d8cd059b8f.png", rating: "4.6", badge: "Sale" },
    { name: "Workout Bench Pro", price: 249, image: "../asset/sandali1.png", rating: "4.7" },
    { name: "Premium Dumbbells", price: 149, image: "../asset/download.png", rating: "4.8" },
    { name: "Running Treadmill X", price: 1499, image: "../asset/file_00000000a35081f4a258f315ae048e94.png", rating: "4.6" },
    { name: "Strength Machine", price: 799, image: "../asset/file_0000000089d48243ace9d6d8cd059b8f.png", rating: "4.7" },
    { name: "Training Bench Elite", price: 329, image: "../asset/sandali1.png", rating: "4.8" },
    { name: "Complete Weight Set", price: 219, image: "../asset/download.png", rating: "4.9" },
    { name: "Cardio Treadmill S", price: 1099, image: "../asset/file_00000000a35081f4a258f315ae048e94.png", rating: "4.6" },
    { name: "Multi Gym Station", price: 949, image: "../asset/file_0000000089d48243ace9d6d8cd059b8f.png", rating: "4.8" },
    { name: "Compact Fitness Bench", price: 189, image: "../asset/sandali1.png", rating: "4.5" },
    { name: "Dumbbell Pair Pro", price: 129, image: "../asset/download.png", rating: "4.7" },
    { name: "Home Treadmill Pro", price: 1199, image: "../asset/file_00000000a35081f4a258f315ae048e94.png", rating: "4.8" },
    { name: "Cable Training Machine", price: 879, image: "../asset/file_0000000089d48243ace9d6d8cd059b8f.png", rating: "4.6" },
    { name: "Flat Weight Bench", price: 159, image: "../asset/sandali1.png", rating: "4.7" },
    { name: "Fitness Weight Pair", price: 99, image: "../asset/download.png", rating: "4.8" },
    { name: "Professional Treadmill", price: 1699, image: "../asset/file_00000000a35081f4a258f315ae048e94.png", rating: "4.9", badge: "Hot" },
    { name: "Premium Home Gym", price: 999, image: "../asset/file_0000000089d48243ace9d6d8cd059b8f.png", rating: "4.8" }
];

const productGrid = document.getElementById("productGrid");

products.forEach(function(product) {
    const card = document.createElement("div");
    card.className = "col-12 col-sm-6 col-lg-3";

    card.innerHTML = `
        <div class="product-card h-100">
            <div class="position-relative">
                ${product.badge ? `<span class="badge bg-danger position-absolute top-0 start-0 m-3">${product.badge}</span>` : ""}
                <img src="${product.image}"
                     class="w-100 product-img"
                     alt="${product.name}">
            </div>

            <div class="p-3">
                <h6 class="text-white">${product.name}</h6>

                <div class="d-flex justify-content-between align-items-center">
                    <span class="text-white fw-bold">$${product.price.toLocaleString("en-US")}</span>
                    <button class="cart-btn" type="button" aria-label="Add ${product.name} to cart">🛒</button>
                </div>

                <div class="mt-2">
                    <span class="stars">★★★★★</span>
                    <small class="text-secondary ms-1">(${product.rating})</small>
                </div>
            </div>
        </div>
    `;

    productGrid.appendChild(card);
});
</script>

</body>
</html>
